<div class="w-full">
  <label class="label label-text">{{ label() }}</label>
  <select
    class="select"
    aria-label="select"
    [class.is-invalid]="
      (control().invalid && control().dirty) ||
      (control().invalid && isSubmitted())
    "
    [class.is-valid]="control().valid && control().dirty"
    (change)="onValueChange($event.target)"
  >
    <!-- <option value="">{{ placeholder() }}</option> -->
    @for (item of data(); track $index) {
    <option
      [value]="item.val"
      [ngValue]="item"
      [selected]="defaultValue() === item.val"
    >
      {{ item.title }}
    </option>
    }
  </select>
  <span class="label">
    @if ( (control().invalid && control().dirty) || control().invalid &&
    isSubmitted() ) {
    <div class="label">
      <span class="label-text-alt">{{ errorMessage() }}</span>
    </div>
    }
  </span>
</div>
