<div class="sm:w-96">
  <label class="label label-text" for="textareaStateSuccessDefault">
    {{ label() }}
  </label>
  <textarea
    class="textarea"
    [(ngModel)]="value"
    [placeholder]="placeholder()"
    id="textareaStateSuccessDefault"
    (ngModelChange)="onValueChange($event)"
    [class.is-invalid]="
      (control().invalid && control().dirty) ||
      (control().invalid && isSubmitted())
    "
    [class.is-valid]="control().valid && control().dirty"
  ></textarea>
  <div class="label">
    @if ( (control().invalid && control().dirty) || (control().invalid &&
    isSubmitted()) ) {
    <span class="label-text-alt">{{ errorMessage() }}</span>
    }
  </div>
</div>
