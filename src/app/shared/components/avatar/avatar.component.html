<div class="avatar" [class]="statusConn()">
  <div
    class="rounded-full"
    [ngClass]="{
      'size-6': size() === 'sm',
      'size-10': size() === 'md',
      'size-14': size() === 'lg',
      'size-16': size() === 'xl',
      'rounded-md': !isRounded(),
      'rounded-full': isRounded(),
    }"
  >
    <img src="{{ src() }}" alt="avatar" />
  </div>
</div>
