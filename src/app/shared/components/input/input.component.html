@if (type()==='checkbox') {
<div class="flex items-center gap-1">
  <input
    type="checkbox"
    class="checkbox"
    [id]="inputLabel"
    [class.is-invalid]="
      (control().invalid && control().dirty) ||
      (control().invalid && isSubmitted())
    "
    [class.is-valid]="control().valid && control().dirty"
  />
  <label class="label label-text text-base" for="{{ inputLabel }}">{{
    placeholder()
  }}</label>
</div>
} @else {
<div class="max-w-sm">
  <label [id]="inputLabel" class="label label-text" for="labelAndHelperText">
    {{ label() }}
  </label>
  <input
    id="{{ inputLabel }}"
    type="text"
    [placeholder]="placeholder()"
    [(ngModel)]="value"
    (ngModelChange)="onValueChange($event)"
    class="input input-{{ size() }} max-w-sm"
    [class.is-invalid]="
      (control().invalid && control().dirty) ||
      (control().invalid && isSubmitted())
    "
    [class.is-valid]="control().valid && control().dirty"
  />
  <span class="label">
    <span class="label-text-alt">{{ helperText() }}</span>

    @if ( (control().invalid && control().dirty) || (control().invalid &&
    isSubmitted()) ) {
    <span class="label-text-alt">{{ errorMessage() }}</span>
    }
  </span>
</div>
}
