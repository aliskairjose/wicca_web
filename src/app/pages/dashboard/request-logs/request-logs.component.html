<app-table-container>
  <table class="table">
    <thead>
      <tr>
        <th>Asesor</th>
        <th>Rechazadas</th>
        <th>Aceptadas</th>
        <th>Total solicitudes</th>
      </tr>
    </thead>
    <tbody>
      @for (log of logs; track $index){
      <tr class="hover">
        <td>
          <span class="flex flex-row items-center gap-2">
            <app-avatar [src]="log.asesor.avatar" size="md" />
            {{ log.asesor.name }} {{ log.asesor.lastName }}
          </span>
        </td>
        <td>{{ log.rejected }}</td>
        <td>{{ log.accepted }}</td>
        <td>{{ log.totalRequests }}</td>
      </tr>
      }
    </tbody>
  </table>
</app-table-container>
