  class="btn btn-text max-sm:btn-square lg:hidden"
  aria-haspopup="dialog"
  aria-expanded="false"
  aria-controls="logo-sidebar"
  data-overlay="#logo-sidebar"
>

</button>

    role="dialog"
    tabindex="-1"
  >

      <ul class="menu gap-y-3">
        @for (m of menu; track $index) {
        <li>
          <a
            class="font-light hover:bg-transparent px-0"
            [routerLink]="[m.path]"
            routerLinkActive="router-link-active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <span class="icon-[tabler--{{ m.icon }}] size-6"></span>
            {{ m.title }}
          </a>
        </li>
        }
      </ul>
