<button
  title="Menu"
  type="button"
  class="btn btn-text max-sm:btn-square lg:hidden"
  aria-haspopup="dialog"
  aria-expanded="false"
  aria-controls="logo-sidebar"
  data-overlay="#logo-sidebar"
>
  <span class="icon-[tabler--menu-2] size-5"></span>
</button>

<div class="wrapper">
  <aside
    id="logo-sidebar"
    class="overlay lg:shadow-none overlay-open:translate-x-0 drawer drawer-start hidden max-w-64 lg:relative lg:z-0 lg:flex lg:translate-x-0 h-screen max-h-screen"
    role="dialog"
    tabindex="-1"
  >
    <div class="drawer-header p-4">
      <div class="flex items-center justify-center gap-3">
        <img
          src="imagotipo-transparent.png"
          alt="logo"
          srcset=""
          class="w-1/2"
        />
      </div>
    </div>
    <div class="drawer-body px-2 flex flex-col justify-between">
      <ul
        class="menu w-64 space-y-0.5 [&_.nested-collapse-wrapper]:space-y-0.5 [&_ul]:space-y-0.5"
      >
        @for (m of menu; track $index) {
        <li>
          @if(m.children){
          <a
            [id]="m.title"
            [attr.data-collapse]="'#' + m.title + '-collapse'"
            class="font-light hover:bg-transparent px-0 text-slate-100 collapse-toggle collapse-open:text-slate-100 collapse-open:bg-base-content/10 open"
          >
            <span class="icon-[tabler--{{ m.icon }}] size-6"></span>
            {{ m.title }}
            <span
              class="icon-[tabler--chevron-down] collapse-open:rotate-180 size-4 transition-all duration-300"
            ></span>
          </a>
          <ul
            [id]="m.title + '-collapse'"
            class="open collapse w-auto overflow-hidden transition-[height] duration-300"
            [attr.aria-labelledby]="m.title"
          >
            @for (child of m.children; track $index) {
            <li>
              <a
                class="font-light hover:bg-transparent px-0 text-slate-100"
                [routerLink]="[child.path]"
                routerLinkActive="router-link-active"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <span class="icon-[tabler--{{ child.icon }}] size-6"></span>
                {{ child.title }}
              </a>
            </li>
            }
          </ul>
          }@else {
          <a
            class="font-light hover:bg-transparent px-0 text-slate-100"
            [routerLink]="[m.path]"
            routerLinkActive="router-link-active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <span class="icon-[tabler--{{ m.icon }}] size-6"></span>
            {{ m.title }}
          </a>
          }
        </li>
        }
      </ul>
      <button type="button" class="btn btn-error" (click)="signout()">
        Cerrar sesión
        <span class="icon-[tabler--logout] size-5"></span>
      </button>
    </div>
  </aside>
  <div class="main-panel">
    <app-dashbar />
    <div class="py-4 grow">
      <router-outlet></router-outlet>
    </div>
    <app-dashboard-footer />
  </div>
</div>
