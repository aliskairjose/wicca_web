<app-table-container
  [metadata]="metadata()!"
  (onChange)="onChangeTable($event)"
>
  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Cliente</th>
        <th>Asesor</th>
        <th>Messages</th>
        <th>Fecha Creación</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (room of rooms; track $index) {
      <tr class="hover">
        <td>{{ room._id }}</td>
        <td>
          <ng-container
            [ngTemplateOutlet]="user"
            [ngTemplateOutletContext]="{ user: room.members[0] }"
          ></ng-container>
        </td>
        <td>
          <ng-container
            [ngTemplateOutlet]="user"
            [ngTemplateOutletContext]="{ user: room.members[1] }"
          ></ng-container>
        </td>
        <td>{{ room.messages.length }}</td>
        <td class="text-nowrap">{{ room.createdAt | date }}</td>
      </tr>
      }
    </tbody>
  </table>
</app-table-container>

<ng-template #user let-user="user">
  <div class="flex items-center gap-2">
    <app-avatar [src]="user.avatar" size="sm" />
    <span>{{ user.name }} {{ user.lastName }}</span>
  </div>
</ng-template>
