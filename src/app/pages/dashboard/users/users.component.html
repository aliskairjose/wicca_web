<app-table-container
  [metadata]="metadata()!"
  (onChange)="onChangeTable($event)"
>
  <table class="table">
    <thead>
      <tr>
        <th>Usuario</th>
        <th>Email</th>
        <th>Usuario</th>
        <th>Usuario desde</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track $index) {
      <tr class="hover">
        <td class="text-nowrap">
          <div class="flex">
            <app-avatar [src]="user.avatar" />
            <div class="flex flex-col ms-1.5">
              <span class="font-medium"
                >{{ user.name }} {{ user.lastName }}</span
              >
              <span class="text-xs text-secondary tracking-wider">{{
                user.role
              }}</span>
            </div>
          </div>
        </td>
        <td>{{ user.email }}</td>
        <td>
          <span [appStatus]="user.isActive" class="w-full"></span>
        </td>
        <td class="text-nowrap">{{ user.createdAt | date }}</td>
        <td>
          <app-button
            [clear]="true"
            icon="pencil"
            shape="circle"
            theme="secondary"
            [routerLink]="[routeEnum.User, user._id]"
          />
          <app-button
            [clear]="true"
            icon="trash"
            shape="circle"
            theme="secondary"
          />
          <app-button
            [clear]="true"
            icon="dots-vertical"
            shape="circle"
            theme="secondary"
          />
        </td>
      </tr>
      }
    </tbody>
  </table>
</app-table-container>
