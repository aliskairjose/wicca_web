@if(user){
<main class="grid md:grid-cols-12 grid-cols-1 md:gap-4 gap-2">
  <div class="xl:col-span-4 md:col-span-6 col-span-12 space-y-4">
    <ng-container [ngTemplateOutlet]="profile"></ng-container>
    <ng-container [ngTemplateOutlet]="dateInfo"></ng-container>
    <ng-container [ngTemplateOutlet]="wallet"></ng-container>
  </div>
  <div class="xl:col-span-8 md:col-span-6 col-span-12 space-y-6">
    <div class="grid xl:grid-cols-2 grid-cols-1 gap-4">
      <ng-container [ngTemplateOutlet]="chats"></ng-container>
      <ng-container [ngTemplateOutlet]="userReviews"></ng-container>
    </div>
  </div>
</main>

<ng-template #profile>
  <div class="card">
    <div class="card-header flex flex-col items-center gap-y-4">
      <div class="avatar" [class]="statusClass()">
        <div class="size-24 rounded-full">
          <img [src]="user.avatar" alt="avatar" />
        </div>
      </div>
      <div class="card-title text-primary/80 text-center">
        {{ fullName() }}
        <p class="text-base text-secondary font-light text-center">
          {{ user.email }}
        </p>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #userReviews>
  <div class="card">
    <div class="card-body space-y-3">
      <h5 class="title">Reviews</h5>
      <ul
        class="border-base-content/25 divide-base-content/25 divide-y-[1px] space-y-2"
      >
        <!-- @for (review of user.reviews; track $index;let first=$first) {
        <li [class.pt-2]="!first">

            <span class="text-sm font-medium">

              {{ review.rate }}/5
            </span>
            <div class="">
              <small>{{ review.createdAt | date }}</small>
            </div>
          </div>
          <p>{{ review.comment }}</p>
          <div class="flex justify-end gap-1.5">
            <app-avatar [src]="review.reviewedTo.avatar" size="sm" />
            <small>
              {{ review.reviewedTo.name }}
              {{ review.reviewedTo.lastName }}
            </small>
          </div>
        </li>
        }@empty {
        <h6 class="text-center">¡No hay comentarios!</h6>
        } -->
      </ul>
    </div>
  </div>
</ng-template>

<ng-template #wallet>
  <div class="card">
    <div class="card-body">
      <h5 class="title">Mi billetera</h5>
      <div class="flex justify-between items-center">
        <span class="text-secondary">Saldo disponible</span>
        <span class="text-primary font-semibold">
          {{ user.wallet?.balance | currency }}
        </span>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #dateInfo>
  <div class="card">
    <div class="card-body">
      <div class="w-full">
        <ul
          class="border-base-content/25 divide-base-content/25 flex flex-col divide-y rounded-md first:*:rounded-t-md last:*:rounded-b-md sm:flex-row sm:divide-x sm:divide-y-0 first:*:sm:rounded-s-md first:*:sm:rounded-tr-none last:*:sm:rounded-e-md last:*:sm:rounded-bl-none rtl:divide-x-reverse text-sm"
        >
          <li class="w-full text-left">
            <small>Fecha registro</small>
            <p class="font-semibold text-secondary/90">
              {{ user.createdAt | date }}
            </p>
          </li>
          <li class="w-full text-right">
            <small>Última conexión</small>
            <p class="font-semibold text-secondary/90">
              {{ user.lastConnect | date : "medium" }}
            </p>
          </li>
        </ul>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #chats>
  <div class="card">
    <div class="card-body">
      <h5 class="title">Mis conversaciones</h5>
      <ul class="divide-base-content/25 divide-y *:py-3 mt-2">
        <!-- @for (room of user.rooms; track $index) {
